name: Report a problem
description: Something didn't copy, didn't fill, or behaved oddly.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to report is from the copier itself: **Problem? Report it** at the bottom of the panel. It
        fills in this form and saves a report file for you to attach below.
  - type: input
    id: version
    attributes:
      label: Copier version
      description: Shown in the panel's update bar and under Settings → Updates.
      placeholder: "0.25.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Which accounts, roughly when, and what you saw in the activity log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: >-
        Drag the vest-copier-report-….json file here. It contains your activity log, diagnostics, settings and
        account balances (account ids are replaced by names), but no passwords or login tokens. Remove anything you
        don't want public.
    validations:
      required: true
